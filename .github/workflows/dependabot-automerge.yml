name: dependabot-automerge

on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: >-
          !contains(steps.meta.outputs.dependency-names, 'notebooklm-py')
          && (
            (steps.meta.outputs.package-ecosystem == 'uv'
              && steps.meta.outputs.update-type == 'version-update:semver-patch')
            || ((steps.meta.outputs.package-ecosystem == 'github_actions'
                || steps.meta.outputs.package-ecosystem == 'pre_commit')
              && (steps.meta.outputs.update-type == 'version-update:semver-patch'
                || steps.meta.outputs.update-type == 'version-update:semver-minor'))
            || (steps.meta.outputs.package-ecosystem == 'docker'
              && steps.meta.outputs.previous-version == steps.meta.outputs.new-version)
          )
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
